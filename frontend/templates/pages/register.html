<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — NSU RAG</title>

    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components/form.css">

    <script src="/static/js/auth.js" defer></script>
</head>

<body>
    <main class="auth-page">

        <section class="auth-info">

            <div class="auth-logo">
                <div class="logo-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <span>NSU RAG</span>
            </div>

            <div class="auth-info-content">
                <h1>
                    Учебные материалы<br>
                    и AI-помощник в одном<br>
                    месте
                </h1>

                <p>
                    Получайте точные ответы на основе материалов ваших курсов.
                    Загружайте документы, задавайте вопросы и учитесь эффективнее.
                </p>
            </div>

        </section>

        <section class="auth-form-section">

            <div class="auth-form-container">

                <nav class="auth-switcher">
                    <a
                        href="login.html"
                        class="auth-switcher-item"
                    >
                        Вход
                    </a>

                    <a
                        href="register.html"
                        class="auth-switcher-item active"
                    >
                        Регистрация
                    </a>
                </nav>

                <h2>Регистрация</h2>

                <p class="auth-description">
                    Создайте учётную запись NSU RAG.
                </p>

                <form id="register-form" class="auth-form">

                    <div class="form-field">
                        <label for="first-name">Имя</label>

                        <input
                            id="first-name"
                            name="first_name"
                            type="text"
                            placeholder="Введите имя"
                            autocomplete="given-name"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="last-name">Фамилия</label>

                        <input
                            id="last-name"
                            name="last_name"
                            type="text"
                            placeholder="Введите фамилию"
                            autocomplete="family-name"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="email">Почта</label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="you@g.nsu.ru"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="password">Пароль</label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Введите пароль"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            required
                        >
                    </div>

                    <p
                        id="form-error"
                        class="form-error"
                        role="alert"
                    ></p>

                    <button
                        class="auth-button"
                        type="submit"
                    >
                        Зарегистрироваться
                    </button>

                </form>

                <div class="auth-notice">
                    Для регистрации используйте университетскую почту НГУ.
                </div>

            </div>

        </section>

    </main>
</body>
</html>
