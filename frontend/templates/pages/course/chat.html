<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Курс — NSU RAG</title>

    <link
        rel="stylesheet"
        href="/static/css/tokens.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/base.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/layout.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components/card.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/components/chat.css"
    >

    <script
        src="/static/js/course.js"
        defer
    ></script>

    <script
        src="/static/js/chat.js"
        defer
    ></script>
</head>

<body>

<div class="app-layout">

    <aside class="sidebar">

        <a
            href="../courses.html"
            class="sidebar-logo"
        >
            <span class="sidebar-logo-icon">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </span>

            <span>NSU RAG</span>
        </a>


        <nav class="sidebar-nav">

            <a
                href="../courses.html"
                class="sidebar-link"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <rect
                        x="3"
                        y="3"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>

                    <rect
                        x="14"
                        y="3"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>

                    <rect
                        x="3"
                        y="14"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>

                    <rect
                        x="14"
                        y="14"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>
                </svg>

                <span>Все курсы</span>
            </a>


            <a
                href="../my-courses.html"
                class="sidebar-link"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M12 3.5L14.7 8.97L20.74 9.85L16.37 14.11L17.4 20.13L12 17.29L6.6 20.13L7.63 14.11L3.26 9.85L9.3 8.97L12 3.5Z"
                    ></path>
                </svg>

                <span>Мои курсы</span>
            </a>


            <a
                href="../profile.html"
                class="sidebar-link"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    ></circle>

                    <path
                        d="M4.5 21a7.5 7.5 0 0 1 15 0"
                    ></path>
                </svg>

                <span>Профиль</span>
            </a>

        </nav>


        <div
            class="sidebar-decoration"
            aria-hidden="true"
        >
            <div class="sidebar-perch"></div>
            <div class="sidebar-owl"></div>
        </div>

    </aside>


    <main class="app-content">

        <a
            href="../courses.html"
            class="course-back"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M15 18L9 12L15 6"
                ></path>
            </svg>

            Все курсы
        </a>


        <header class="page-header course-workspace-header">

            <div>

                <h1 id="course-title">
                    Загрузка курса...
                </h1>

                <div class="course-workspace-meta">

                    <span
                        id="course-access"
                        class="course-access"
                    >
                        Загрузка...
                    </span>

                    <span
                        id="course-owner"
                        class="course-owner-badge"
                        hidden
                    >
                        Вы владелец
                    </span>

                </div>

            </div>

        </header>


        <nav class="workspace-tabs">

            <a
                id="chat-tab"
                href="chat.html"
                class="workspace-tab active"
            >
                AI-помощник
            </a>

            <a
                id="materials-tab"
                href="materials.html"
                class="workspace-tab"
            >
                Материалы курса
            </a>

        </nav>


        <p
            id="course-error"
            class="page-error"
            role="alert"
        ></p>


        <section class="chat-shell">

            <div
                id="chat-messages"
                class="chat-messages"
                aria-live="polite"
            >

                <div
                    id="chat-empty"
                    class="chat-empty"
                >

                    <div class="chat-empty-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H10l-5 4v-4.8A2.5 2.5 0 0 1 4 13.5z"
                            ></path>

                            <path
                                d="M8 8h8"
                            ></path>

                            <path
                                d="M8 11h5"
                            ></path>
                        </svg>

                    </div>

                    <h2>
                        AI-помощник курса
                    </h2>

                    <p>
                        Задайте вопрос по материалам курса.
                        Ответ будет сформирован только на основе загруженных документов.
                    </p>

                </div>


                <div
                    id="chat-loading"
                    class="chat-loading"
                    hidden
                >

                    <div class="chat-assistant-avatar">
                        AI
                    </div>

                    <div class="chat-loading-bubble">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>


            <div class="chat-composer">

                <p
                    id="chat-error"
                    class="chat-error"
                    role="alert"
                ></p>


                <form
                    id="chat-form"
                    class="chat-form"
                >

                    <textarea
                        id="chat-question"
                        name="question"
                        rows="1"
                        maxlength="4000"
                        placeholder="Задайте вопрос по материалам курса..."
                        autocomplete="off"
                    ></textarea>


                    <button
                        id="chat-submit"
                        type="submit"
                        class="chat-submit"
                        aria-label="Отправить вопрос"
                        disabled
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <path
                                d="M5 12h14"
                            ></path>

                            <path
                                d="m14 7 5 5-5 5"
                            ></path>
                        </svg>
                    </button>

                </form>

            </div>

        </section>

    </main>

</div>

</body>

</html>
