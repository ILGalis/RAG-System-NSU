<svg
    width="1000"
    height="700"
    viewBox="0 0 1000 700"
    xmlns="http://www.w3.org/2000/svg"
>
    <g transform="translate(-10 700)">

        <!-- Центральная часть -->

        <circle
            r="92"
            fill="#4FAE2F"
            opacity="0.045"
        />

        <!-- Тонкие дуги -->

        <g
            fill="none"
            stroke="#4FAE2F"
            stroke-width="2"
        >
            <circle r="130" opacity="0.14"/>
            <circle r="205" opacity="0.12"/>

            <circle r="290" opacity="0.11"/>
            <circle r="370" opacity="0.10"/>

            <circle r="550" opacity="0.075"/>
            <circle r="650" opacity="0.055"/>
            <circle r="690" opacity="0.04"/>
        </g>

        <!-- Толстые дуги -->

        <g
            fill="none"
            stroke="#4FAE2F"
            stroke-linecap="butt"
        >
            <circle
                r="170"
                stroke-width="56"
                opacity="0.06"
            />

            <circle
                r="330"
                stroke-width="66"
                opacity="0.05"
            />

            <circle
                r="505"
                stroke-width="76"
                opacity="0.04"
            />
        </g>

        <!-- Первый ряд -->

        <g
            fill="#4FAE2F"
            opacity="0.08"
        >
            <path
                id="tile-inner"
                d="
                    M -18 -215
                    L 18 -215
                    L 24 -275
                    L -24 -275
                    Z
                "
            />

            <use href="#tile-inner" transform="rotate(-15)"/>
            <use href="#tile-inner"/>
            <use href="#tile-inner" transform="rotate(15)"/>
            <use href="#tile-inner" transform="rotate(30)"/>
            <use href="#tile-inner" transform="rotate(45)"/>
            <use href="#tile-inner" transform="rotate(60)"/>
            <use href="#tile-inner" transform="rotate(75)"/>
            <use href="#tile-inner" transform="rotate(90)"/>
        </g>

        <!-- Второй ряд -->

        <g
            fill="#4FAE2F"
            opacity="0.07"
        >
            <path
                id="tile-middle"
                d="
                    M -29 -380
                    L 29 -380
                    L 37 -445
                    L -37 -445
                    Z
                "
            />

            <use href="#tile-middle" transform="rotate(-15)"/>
            <use href="#tile-middle"/>
            <use href="#tile-middle" transform="rotate(15)"/>
            <use href="#tile-middle" transform="rotate(30)"/>
            <use href="#tile-middle" transform="rotate(45)"/>
            <use href="#tile-middle" transform="rotate(60)"/>
            <use href="#tile-middle" transform="rotate(75)"/>
            <use href="#tile-middle" transform="rotate(90)"/>
        </g>

        <!-- Третий ряд -->

        <g
            fill="#4FAE2F"
            opacity="0.055"
        >
            <path
                id="tile-outer"
                d="
                    M -40 -560
                    L 40 -560
                    L 51 -630
                    L -51 -630
                    Z
                "
            />

            <use href="#tile-outer" transform="rotate(-15)"/>
            <use href="#tile-outer"/>
            <use href="#tile-outer" transform="rotate(15)"/>
            <use href="#tile-outer" transform="rotate(30)"/>
            <use href="#tile-outer" transform="rotate(45)"/>
            <use href="#tile-outer" transform="rotate(60)"/>
            <use href="#tile-outer" transform="rotate(75)"/>
            <use href="#tile-outer" transform="rotate(90)"/>
        </g>

    </g>
</svg>