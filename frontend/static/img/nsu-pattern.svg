<svg width="1000" height="700" viewBox="0 0 1000 700"
    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
        <path id="sun-tile-inner" d="M -18 -215 L 18 -215 L 24 -275 L -24 -275 Z"/>
        <path id="sun-tile-middle" d="M -29 -380 L 29 -380 L 37 -445 L -37 -445 Z"/>
        <path id="sun-tile-outer" d="M -40 -560 L 40 -560 L 51 -630 L -51 -630 Z"/>

        <!-- Круглые розетки и ромбовидные перемычки с фотографии мозаики -->
        <g id="sun-rosette">
            <circle cy="-330" r="11" opacity="0.13"/>
        </g>
        <g id="sun-lozenge">
            <path d="M 0 -354 L 30 -330 L 0 -306 L -30 -330 Z"
                fill="none" stroke="#4FAE2F" stroke-width="1.6" opacity="0.12"/>
            <path d="M 0 -354 L 30 -330 L 0 -306 Z" opacity="0.045"/>
        </g>

        <!-- Двухчастный острый луч: две грани вместо волнистой линии -->
        <g id="sun-ray">
            <path d="M -23 -467 L 0 -543 L 0 -467 Z" opacity="0.095"/>
            <path d="M 0 -467 L 0 -543 L 23 -467 Z" opacity="0.045"/>
        </g>
    </defs>
    <g transform="translate(-10 700)" fill="#4FAE2F">
        <circle r="92" opacity="0.045"/>
        <g fill="none" stroke="#4FAE2F" stroke-width="2">
            <circle r="130" opacity="0.14"/>
            <circle r="205" opacity="0.12"/>
            <circle r="290" opacity="0.11"/>
            <circle r="370" opacity="0.1"/>
            <circle r="550" opacity="0.075"/>
            <circle r="650" opacity="0.055"/>
            <circle r="690" opacity="0.04"/>
        </g>
        <g fill="none" stroke="#4FAE2F">
            <circle r="170" stroke-width="56" opacity="0.06"/>
            <circle r="330" stroke-width="66" opacity="0.05"/>
            <circle r="505" stroke-width="76" opacity="0.04"/>
        </g>
        <use href="#sun-tile-inner" transform="rotate(-15)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(0)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(15)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(30)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(45)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(60)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(75)" opacity="0.08"/>
        <use href="#sun-tile-inner" transform="rotate(90)" opacity="0.08"/>
        <use href="#sun-tile-middle" transform="rotate(-15)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(0)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(15)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(30)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(45)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(60)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(75)" opacity="0.07"/>
        <use href="#sun-tile-middle" transform="rotate(90)" opacity="0.07"/>
        <use href="#sun-tile-outer" transform="rotate(-15)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(0)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(15)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(30)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(45)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(60)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(75)" opacity="0.055"/>
        <use href="#sun-tile-outer" transform="rotate(90)" opacity="0.055"/>

        <!-- Пояс розеток в широкой дуге радиуса 330 -->
        <use href="#sun-rosette" transform="rotate(0)"/>
        <use href="#sun-rosette" transform="rotate(15)"/>
        <use href="#sun-rosette" transform="rotate(30)"/>
        <use href="#sun-rosette" transform="rotate(45)"/>
        <use href="#sun-rosette" transform="rotate(60)"/>
        <use href="#sun-rosette" transform="rotate(75)"/>
        <use href="#sun-rosette" transform="rotate(90)"/>
        <use href="#sun-lozenge" transform="rotate(7.5)"/>
        <use href="#sun-lozenge" transform="rotate(22.5)"/>
        <use href="#sun-lozenge" transform="rotate(37.5)"/>
        <use href="#sun-lozenge" transform="rotate(52.5)"/>
        <use href="#sun-lozenge" transform="rotate(67.5)"/>
        <use href="#sun-lozenge" transform="rotate(82.5)"/>

        <!-- Лучи в широкой дуге радиуса 505 -->
        <use href="#sun-ray" transform="rotate(7.5)"/>
        <use href="#sun-ray" transform="rotate(22.5)"/>
        <use href="#sun-ray" transform="rotate(37.5)"/>
        <use href="#sun-ray" transform="rotate(52.5)"/>
        <use href="#sun-ray" transform="rotate(67.5)"/>
        <use href="#sun-ray" transform="rotate(82.5)"/>
    </g>
</svg>
