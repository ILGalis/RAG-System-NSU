name: Backend CI

on:
  push:
    branches: [ "dev", "main", "backend-week-*" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nsu_rag
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        pip install -r requirements.txt
        pip install -r requirements-rag.txt

    - name: Lint with ruff
      run: ruff check .

    - name: Run backend tests on PostgreSQL
      env:
        DATABASE_URL: postgresql+psycopg://nsu_rag:local_dev_password@127.0.0.1:5432/nsu_rag
        TEST_DATABASE_URL: postgresql+psycopg://nsu_rag:local_dev_password@127.0.0.1:5432/rag_test
        QDRANT_URL: http://127.0.0.1:6333
        SMTP_HOST: localhost
        SMTP_PORT: 1025
        SMTP_USER: test
        SMTP_PASSWORD: test
        SMTP_FROM: test@example.com
      run: |
        pytest tests/test_auth.py tests/test_space.py tests/test_user_db.py \
               tests/test_member.py tests/test_invistigation.py tests/test_documents.py -q