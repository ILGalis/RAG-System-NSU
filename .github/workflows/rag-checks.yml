name: RAG checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-rag.txt
      - run: python -m pip install -r requirements-rag.txt
      - run: python -m ruff check app/rag rag_eval rag_tests
      - run: python -m pytest rag_tests -q
      - name: Parser and embedding regressions
        run: >-
          python -m pytest --noconftest
          tests/test_parsers.py tests/test_pdf_parser.py
          tests/test_docx_parser.py tests/test_txt_parser.py
          tests/test_chunking.py tests/test_embeddings.py -q
      - name: Import RAG entry points
        run: python -c "from app.rag.integration import RAGApplication; from rag_eval.reranking import rerank_report"
